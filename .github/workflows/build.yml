name: Build PyPI
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs this
          workflow twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint:
    uses: reqstool/.github/.github/workflows/python-lint.yml@91cd368066d5458b5d46bdf34c4d8ca483f6633f # 1.2.2

  schema-checks:
    name: Schema and codegen checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pip package(s)
        # renovate: datasource=pypi depName=hatch
        run: pip install hatch==1.18.2
      - name: Install pip package check-jsonschema
        # renovate: datasource=pypi depName=check-jsonschema
        run: pip install check-jsonschema==0.39.0
      - name: Validate JSON Schemas
        run: check-jsonschema --verbose --schemafile "https://json-schema.org/draft/2020-12/schema" src/reqstool/resources/schemas/*/*
      - name: Validate generated Pydantic models are up to date
        run: hatch run dev:codegen-check

  build:
    needs: [lint, schema-checks]
    uses: reqstool/.github/.github/workflows/python-build-hatch.yml@91cd368066d5458b5d46bdf34c4d8ca483f6633f # 1.2.2
    with:
      coverage-source: reqstool
      ref: ${{ inputs.ref }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}

  reqstool:
    needs: build
    uses: reqstool/.github/.github/workflows/common-reqstool-verify.yml@91cd368066d5458b5d46bdf34c4d8ca483f6633f # 1.2.2
    with:
      build-artifact: ${{ inputs.artifact-name || 'dist' }}-build

  # Installs the wheel built above (on Linux) on every supported OS and runs the CLI over the
  # reqstool-regression fixtures, so platform-specific breakage (e.g. #457 on Windows) turns CI red.
  smoke:
    name: Smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Check out reqstool-regression fixtures
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          repository: reqstool/reqstool-regression
          path: regression
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - name: Download built wheel
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact-name || 'dist' }}
          path: dist
      - name: Install wheel
        run: pip install dist/*.whl
      - name: reqstool --help
        run: reqstool -h
      - name: Run fixtures
        # Run from outside the checkout so the installed package is the one under test.
        run: python .github/scripts/smoke_regression.py regression "$RUNNER_TEMP/smoke-out"
        working-directory: ${{ github.workspace }}
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-${{ matrix.os }}-${{ inputs.artifact-name || 'dist' }}
          path: ${{ runner.temp }}/smoke-out

  smoke-compare:
    name: Smoke (outputs identical across OSes)
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Download outputs
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: smoke-*-${{ inputs.artifact-name || 'dist' }}
          path: out
      - name: Compare macOS and Windows against Linux
        run: |
          status=0
          for os in macos-latest windows-latest; do
            echo "::group::diff ubuntu-latest vs $os"
            diff -ru "out/smoke-ubuntu-latest-${{ inputs.artifact-name || 'dist' }}" "out/smoke-$os-${{ inputs.artifact-name || 'dist' }}" | head -100 || true
            diff -rq "out/smoke-ubuntu-latest-${{ inputs.artifact-name || 'dist' }}" "out/smoke-$os-${{ inputs.artifact-name || 'dist' }}" || status=1
            echo "::endgroup::"
          done
          exit $status

  # Builds the Dockerfile from the wheel built above (the version is not on PyPI yet) and runs it, so
  # a broken base image or an unsatisfiable dependency on Alpine turns CI red before release.
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Download built wheel
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact-name || 'dist' }}
          path: dist
      - name: Read wheel version
        id: wheel
        run: |
          whl=$(basename dist/reqstool-*.whl)
          version=${whl#reqstool-}
          echo "version=${version%%-*}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          tags: reqstool:ci
          build-args: REQSTOOL_VERSION=${{ steps.wheel.outputs.version }}
          build-contexts: wheels=dist
      - name: Smoke test image
        env:
          EXPECTED: ${{ steps.wheel.outputs.version }}
        run: |
          actual=$(docker run --rm reqstool:ci reqstool --version | head -n 1)
          echo "reqstool --version: $actual (expected $EXPECTED)"
          test "$actual" = "$EXPECTED"

  ci:
    if: ${{ always() }}
    needs: [lint, schema-checks, build, reqstool, smoke, smoke-compare, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; r={k:v["result"] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(0 if all(v=="success" for v in r.values()) else 1)'

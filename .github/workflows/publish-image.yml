name: Publish image to GHCR

on:
  workflow_call:
    inputs:
      version:
        description: "reqstool version on PyPI to build the image for"
        required: true
        type: string
      dry-run:
        description: "Build the image but do not push it."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "reqstool version on PyPI to build the image for (e.g. 0.9.0)"
        required: true
        type: string
      dry-run:
        description: "Build the image but do not push it."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wait-for-pypi:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Wait for PyPI availability
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Waiting for reqstool==${VERSION} to become installable from PyPI..."
          for i in $(seq 1 90); do
            if python3 -m pip download --quiet --disable-pip-version-check --no-deps --no-cache-dir \
                --dest "${RUNNER_TEMP}/pypi-probe" "reqstool==${VERSION}"; then
              echo "reqstool==${VERSION} is available on PyPI"
              exit 0
            fi
            echo "Attempt ${i}/90 - not yet available, waiting 10s..."
            sleep 10
          done
          echo "::error::reqstool==${VERSION} not found on PyPI after 15 minutes"
          exit 1

  publish-image-to-ghcr:
    needs: wait-for-pypi
    uses: reqstool/.github/.github/workflows/common-publish-to-docker.yml@ff7323b2f1214898e8f3191ffab3d8bdf478f208 # 1.3.1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ inputs.version }}
      image-name: ${{ github.repository_owner }}/reqstool
      dry-run: ${{ inputs.dry-run }}
